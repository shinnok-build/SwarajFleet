name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Invariant smoke test
        run: python3 tests/test_smoke.py

  site:
    name: Browser engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Invariant suite (0 collisions, completion, determinism)
        run: node tests/site/engine.test.js
      - name: Faithfulness cross-check vs Python reference (72 worlds)
        run: node tests/site/crosscheck.js
      - name: DOM boot + controls smoke
        run: node tests/site/dom_smoke.js
      - name: DOM full-run to completion
        run: node tests/site/dom_run.js
